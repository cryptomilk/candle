[package]
name = "candle-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle-kernels = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
cutile = { workspace = true, optional = true }
# `gpu-sort` (default-on) builds an amdgcn kernel via a proc-macro that shells out
# to a nested nightly `-Zbuild-std` cargo invocation. Candle never calls rocm-rs'
# sort, so it is disabled to keep `--features rocm` buildable on a stable toolchain.
rocm-rs = { version = "0.5", optional = true, default-features = false, features = [
    "macros",
] }
candle-rocm-kernels = { workspace = true, optional = true }
# Needed to name `libloading::Symbol<T>`, the type
# `candle_rocm_kernels::MmqGgufLibrary::get` returns: the AMD WMMA `mmq_gguf`
# kernels load as a shared library rather than a `hipModule_t`, so resolving
# their launcher functions goes through `libloading` instead of
# `hipModuleGetFunction`. See `quantized::rocm::mmq_wmma`.
libloading = { version = "0.8", optional = true }
gemm = { workspace = true }
half = { workspace = true, features = ["zerocopy"] }
float8 = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true }
libm = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
yoke = { workspace = true }
zerocopy = { workspace = true }
zip = { workspace = true }
parking_lot = "0.12.5"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["fancy-regex"] }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels"]
cutile = ["cuda", "dep:cutile"]
rocm = ["dep:rocm-rs", "dep:candle-rocm-kernels", "dep:libloading"]
# Opt-in MIOpen conv forward, mirroring how `cudnn` layers over `cuda`. The
# default ROCm build uses the im2col + GEMM path and never links libMIOpen.
miopen = ["rocm", "rocm-rs/miopen"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "cutile"
required-features = ["cutile"]
